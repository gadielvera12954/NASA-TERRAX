# Render Blueprint for the TERRA-X server (live engine and the SI chat relay). See PUBLICAR.md.
# The server is stateless: no database, no accounts, so no persistent disk is needed.
services:
  - type: web
    name: terrax-servidor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-motor.txt -r servidor/requirements.txt
    startCommand: waitress-serve --host 0.0.0.0 --port $PORT servidor.app:app
    healthCheckPath: /api/estado
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TERRAX_DETRAS_DE_PROXY
        value: "1"
      - key: TERRAX_GEMINI_KEY
        sync: false   # paste the Gemini key in the Render dashboard; never in the repository
